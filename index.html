<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese Writing Practice</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#222;--mute:#777;--line:#e2dccf;--acc:#c0392b;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222227;--ink:#f1efe9;--mute:#9a9aa3;--line:#3a3a42;--acc:#ff7a6b;--ok:#5fd09a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222227;--ink:#f1efe9;--mute:#9a9aa3;--line:#3a3a42;--acc:#ff7a6b;--ok:#5fd09a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
i{font-style:normal}
.menu{display:flex;flex-direction:column;gap:12px}
.mbtn{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px}
.mbtn .big{font-size:30px;min-width:72px;text-align:center;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;white-space:nowrap}
.mbtn small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.mbtn:disabled{opacity:.5}
.back{border:0;background:none;color:var(--acc);font-size:15px;padding:8px 0;margin-bottom:4px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.score{font-size:14px;color:var(--mute)}
.prompt{text-align:center;margin:8px 0}
.prompt small{color:var(--mute);display:block;font-size:14px}
.prompt b{font-size:44px;letter-spacing:2px;display:block}
.prompt b.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.prompt em{display:block;font-style:normal;color:var(--mute);font-size:15px;margin-top:2px}
.pad{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;aspect-ratio:1/1;width:100%}
.pad.wide{aspect-ratio:2/1}
.pad::before,.pad::after{content:"";position:absolute;background:var(--line);opacity:.6}
.pad::before{left:50%;top:6%;bottom:6%;width:1px}
.pad::after{top:50%;left:6%;right:6%;height:1px}
.pad.wide::before{display:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;line-height:1;z-index:1;pointer-events:none;color:var(--mute);opacity:0;transition:opacity .15s;white-space:nowrap}
.ghost.show{opacity:.28}
.ghost.answer{opacity:1;color:var(--ok)}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.row button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.row input{flex:1;min-width:0;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opt{margin-top:12px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px;justify-content:center}
.verdict{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.verdict b{display:block;font-size:17px;margin-bottom:2px}
.verdict span{color:var(--mute)}
.typebox{margin-top:8px}
.typebox input{width:100%;padding:16px;font-size:22px;text-align:center;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.hide{display:none!important}
</style>
</head>
<body>
<main>

<section class="screen" id="sHome">
  <h1>Japanese Writing Practice</h1>
  <p class="sub">What do you want to practice?</p>
  <div class="menu">
    <button class="mbtn" data-s="hira"><span class="big">あ</span><span>Hiragana<small>ひらがな</small></span></button>
    <button class="mbtn" data-s="kata"><span class="big">ア</span><span>Katakana<small>カタカナ</small></span></button>
    <button class="mbtn" disabled><span class="big">漢</span><span>Kanji<small>Coming soon</small></span></button>
  </div>
</section>

<section class="screen hide" id="sMode">
  <button class="back" data-back>← Back</button>
  <h1 id="modeTitle">Hiragana</h1>
  <p class="sub">Choose a drill</p>
  <div class="menu">
    <button class="mbtn" data-m="alpha"><span class="big">か</span><span>Writing alphabet drills<small>Write one character at a time</small></span></button>
    <button class="mbtn" data-m="word"><span class="big">ねこ</span><span>Writing word drills<small>Romaji → kana: draw the whole word</small></span></button>
    <button class="mbtn" data-m="quiz"><span class="big">?</span><span>Guess the Word<small>Type the English meaning or the romaji</small></span></button>
  </div>
</section>

<section class="screen hide" id="sSet">
  <button class="back" data-back>← Back</button>
  <h1>Vocabulary</h1>
  <p class="sub">Choose a word set</p>
  <div class="menu" id="setList"></div>
</section>

<section class="screen hide" id="sDir">
  <button class="back" data-back>← Back</button>
  <h1>Quiz type</h1>
  <p class="sub" id="dirSub"></p>
  <div class="menu">
    <button class="mbtn" data-d="re"><span class="big">R→E</span><span>Romaji → English<small>See the romaji, type the English meaning</small></span></button>
    <button class="mbtn" data-d="ke"><span class="big"><i class="sg"></i>→E</span><span><i class="sn"></i> → English<small>See the word, type the English meaning</small></span></button>
    <button class="mbtn" data-d="kr"><span class="big"><i class="sg"></i>→R</span><span><i class="sn"></i> → Romaji<small>See the word, type it in romaji</small></span></button>
    
  </div>
</section>

<section class="screen hide" id="sCount">
  <button class="back" data-back>← Back</button>
  <h1>How many?</h1>
  <p class="sub" id="countSub"></p>
  <div class="menu">
    <button class="mbtn" data-n="10"><span class="big">10</span><span>Quick round</span></button>
    <button class="mbtn" data-n="20"><span class="big">20</span><span>Medium round</span></button>
    <button class="mbtn" data-n="all"><span class="big">∞</span><span>All<small id="allSub"></small></span></button>
    <button class="mbtn" id="custBtn"><span class="big">✎</span><span>Customize<small>Pick your own number</small></span></button>
    <div class="row hide" id="custRow"><input id="cNum" type="number" min="1" max="200" inputmode="numeric" placeholder="e.g. 15"><button class="pri" id="cGo">Start</button></div>
  </div>
</section>

<section class="screen hide" id="sResult">
  <h1>Done! 🎉</h1>
  <p class="sub" id="resSub"></p>
  <div class="prompt"><b id="resText"></b></div>
  <div class="row"><button id="toMenu">Home</button><button class="pri" id="again">Practice again</button></div>
</section>

<section class="screen hide" id="sDrill">
  <div class="top"><button class="back" data-back>← Back</button><div class="score" id="score">0 / 0</div></div>
  <div class="prompt"><small id="plabel"></small><b id="pmain"></b><em id="psub"></em></div>
  <div class="pad" id="pad"><div class="ghost" id="ghost"></div><canvas id="cv"></canvas></div>
  <div class="typebox hide" id="tbox"><input id="typed" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type your answer"></div>
  <div class="row" id="r1"><button id="clear">Clear</button><button class="pri" id="check">Check</button></div>
  <div class="row hide" id="r2"><button id="miss">✗ Missed</button><button class="ok" id="got">✓ Got it</button></div>
  <div class="verdict hide" id="verdict"><b id="vT"></b><span id="vS"></span></div>
  <div class="row hide" id="r3"><button id="flip">Wrong verdict? Flip</button><button class="pri" id="nxt">Next →</button></div>
  <label class="opt" id="optL"><input type="checkbox" id="trace"> Trace mode (show faint guide)</label>
</section>

</main>
<script>
var KANA={
hira:"あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split(""),
kata:"アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン".split("")};
var R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
/* word = [kana, romaji, english] */
var WORDS={
hira:{
starter:[["ねこ","neko","cat"],["いぬ","inu","dog"],["さかな","sakana","fish"],["みず","mizu","water"],["やま","yama","mountain"],["はな","hana","flower"],["そら","sora","sky"],["ほし","hoshi","star"],["さくら","sakura","cherry blossom"],["つき","tsuki","moon"],["あめ","ame","rain"],["すし","sushi","sushi"],["ひと","hito","person"],["ともだち","tomodachi","friend"],["ごはん","gohan","rice / meal"],["おはよう","ohayou","good morning"],["ありがとう","arigatou","thank you"],["こんにちは","konnichiwa","hello"]],
d2:[["さかな","sakana","fish"],["つくえ","tsukue","desk"],["ちかてつ","chikatetsu","subway"],["とけい","tokei","clock / watch"],["おかし","okashi","sweets / snacks"]],
d3:[["くるま","kuruma","car"],["ねこ","neko","cat"],["ひこうき","hikouki","airplane"],["せんせい","sensei","teacher"],["はな","hana","flower"],["きもの","kimono","kimono"],["いぬ","inu","dog"],["くつ","kutsu","shoes"],["あたま","atama","head"],["さいふ","saifu","wallet"]],
d4:[["たまご","tamago","egg"],["かばん","kaban","bag"],["めがね","megane","glasses"],["みず","mizu","water"],["でんわ","denwa","telephone"],["ぶどう","budou","grapes"],["げんき","genki","healthy / energetic"],["かぜ","kaze","cold / wind"],["くだもの","kudamono","fruit"],["てんぷら","tenpura","tempura"]]},
kata:{starter:[["コーヒー","koohii","coffee"],["テレビ","terebi","television"],["ケーキ","keeki","cake"],["ピアノ","piano","piano"],["カメラ","kamera","camera"],["パン","pan","bread"],["ミルク","miruku","milk"],["ホテル","hoteru","hotel"],["バナナ","banana","banana"],["アイス","aisu","ice cream"],["ラジオ","rajio","radio"],["タクシー","takushii","taxi"],["ギター","gitaa","guitar"],["サッカー","sakkaa","soccer"],["ノート","nooto","notebook"],["スマホ","sumaho","smartphone"],["ピザ","piza","pizza"]]}};
var SETS=[["starter","Starter words","★"],["d2","Day 2 Vocabulary","D2"],["d3","Day 3 Vocabulary","D3"],["d4","Day 4 Vocabulary","D4"],["all","All days (2–4)","∞"]];
var DIRN={re:"Romaji → English",ke:"Kana → English",kr:"Kana → Romaji",rk:"Romaji → Kana"};

var script="hira",mode="alpha",setId="starter",wdir="re",cur=null,curKind="kana",curAns="";
var right=0,total=0,drawing=false,last=null,queue=[],N=10,lastN=10;
var sample=null,busy=false,scored=false,lastOK=false;
var stack=[],scr="sHome";
function $(i){return document.getElementById(i)}
var cv=$("cv"),ctx=cv.getContext("2d"),ghost=$("ghost"),trace=$("trace"),pad=$("pad");
var SCREENS=["sHome","sMode","sSet","sDir","sCount","sResult","sDrill"];
function show(id){SCREENS.forEach(function(s){$(s).classList.toggle("hide",s!==id)});scr=id}
function go(id){stack.push(scr);show(id)}
function back(){show(stack.pop()||"sHome")}
function sname(){return script==="hira"?"Hiragana":"Katakana"}
function setName(){for(var i=0;i<SETS.length;i++)if(SETS[i][0]===setId)return SETS[i][1];return ""}
function dname(d){return DIRN[d].replace("Kana",sname())}

(async function(){try{if(window.claude)sample=await claude.use("sample")}catch(e){sample=null}})();

/* ---------- pool & queue ---------- */
function wordsOf(){var W=WORDS[script];if(setId==="all")return W.d2.concat(W.d3,W.d4);return W[setId]||W.starter}
function pool(){
  if(mode==="alpha")return KANA[script].map(function(c,i){return{k:c,r:R[i],e:""}});
  return wordsOf().map(function(w){return{k:w[0],r:w[1],e:w[2]}});
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function buildQueue(n){var q=[];while(q.length<n){q=q.concat(shuffle(pool()))}return q.slice(0,n)}

/* ---------- menus ---------- */
function buildSets(){
  var box=$("setList");box.textContent="";
  var W=WORDS[script];
  SETS.forEach(function(s){
    if(script!=="hira"&&s[0]!=="starter")return;
    var n=s[0]==="all"?W.d2.length+W.d3.length+W.d4.length:W[s[0]].length;
    var b=document.createElement("button");b.className="mbtn";
    var big=document.createElement("span");big.className="big";big.textContent=s[2];
    var t=document.createElement("span");t.textContent=s[1];
    var sm=document.createElement("small");sm.textContent=n+" words";t.appendChild(sm);
    b.appendChild(big);b.appendChild(t);
    b.onclick=function(){setId=s[0];afterSet()};
    box.appendChild(b);
  });
}
function prepDir(){
  document.querySelectorAll(".sg").forEach(function(e){e.textContent=script==="hira"?"あ":"ア"});
  document.querySelectorAll(".sn").forEach(function(e){e.textContent=sname()});
  $("dirSub").textContent=sname()+" · "+setName();
}
function afterSet(){if(mode==="word"){wdir="rk";toCount()}else{prepDir();go("sDir")}}
function toCount(){
  $("countSub").textContent=sname()+" · "+(mode==="alpha"?"alphabet drills":setName()+" · "+dname(wdir));
  $("allSub").textContent=pool().length+(mode==="alpha"?" characters":" words");
  $("custRow").classList.add("hide");go("sCount");
}
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){
  script=b.dataset.s;$("modeTitle").textContent=script==="hira"?"Hiragana  ひらがな":"Katakana  カタカナ";go("sMode")}});
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){
  mode=b.dataset.m;
  if(mode==="alpha"){toCount()}
  else if(script==="hira"){buildSets();go("sSet")}
  else{setId="starter";afterSet()}
}});
document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){wdir=b.dataset.d;toCount()}});
document.querySelectorAll("[data-back]").forEach(function(b){b.onclick=back});
document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){var v=b.dataset.n;start(v==="all"?pool().length:parseInt(v,10))}});
$("custBtn").onclick=function(){$("custRow").classList.toggle("hide");$("cNum").focus()};
$("cGo").onclick=function(){var v=parseInt($("cNum").value,10);if(!v||v<1){$("cNum").focus();return}start(Math.min(v,200))};
$("again").onclick=function(){start(lastN)};
$("toMenu").onclick=function(){stack=[];show("sHome")};

/* ---------- drawing ---------- */
function ink(){return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#222"}
function size(){
  var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(!r.width)return;
  cv.width=r.width*d;cv.height=r.height*d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.lineWidth=Math.max(5,Math.min(r.width,r.height)/(mode==="alpha"?24:28));ctx.lineCap="round";ctx.lineJoin="round";
}
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);
  ctx.strokeStyle=ctx.fillStyle=ink();
  ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,7);ctx.fill();
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;e.preventDefault();var p=pos(e);
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
});
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
function clearPad(){var r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height)}

/* ---------- drill ---------- */
function start(n){
  lastN=n;
  pad.classList.toggle("wide",mode!=="alpha");
  pad.classList.toggle("hide",mode==="quiz");
  right=total=0;cur=null;N=n;queue=buildQueue(n);score();
  if(scr==="sResult")show("sDrill");else go("sDrill");
  size();next();
}
function next(keep){
  if(!keep){if(!queue.length){showResult();return}cur=queue.shift()}
  var d=mode==="alpha"?"alpha":wdir,label,main,sub="",jp=false;
  if(d==="alpha"){label="Write the character for:";main=cur.r;curAns=cur.k;curKind="kana"}
  else if(d==="re"){label="Type the English meaning of:";main=cur.r;curAns=cur.e;curKind="en"}
  else if(d==="ke"){label="Type the English meaning of:";main=cur.k;curAns=cur.e;curKind="en";jp=true}
  else if(d==="kr"){label="Type this in romaji:";main=cur.k;curAns=cur.r;curKind="rom";jp=true}
  else{label="Draw this word in "+sname().toLowerCase()+":";main=cur.r;sub=cur.e;curAns=cur.k;curKind="kana"}
  $("plabel").textContent=label;$("pmain").textContent=main;$("psub").textContent=sub;
  $("pmain").className=jp?"jp":"";
  $("pmain").style.fontSize=d==="alpha"?"44px":(jp?"40px":"30px");
  ghost.textContent=curAns;
  ghost.style.fontFamily=curKind==="kana"?"":"system-ui,-apple-system,sans-serif";
  var w=pad.clientWidth,h=pad.clientHeight,kana=curKind==="kana";
  ghost.style.fontSize=Math.min(h*(kana?0.78:0.45),(w*0.9)/(curAns.length*(kana?1:0.55)))+"px";
  ghost.className="ghost"+(trace.checked?" show":"");
  var typed=curKind!=="kana";$("tbox").classList.toggle("hide",!typed);$("optL").classList.toggle("hide",typed);$("typed").value="";$("typed").readOnly=false;
  if(typed&&!keep)$("typed").focus();
  clearPad();$("r1").classList.remove("hide");$("r2").classList.add("hide");$("r3").classList.add("hide");$("verdict").classList.add("hide");scored=false;
}
function score(){$("score").textContent=total+" / "+N+" · ✓ "+right}
function showResult(){
  $("resText").textContent=right+" / "+total;
  $("resSub").textContent=total?Math.round(right/total*100)+"% correct":"";
  show("sResult");
}
function say(t,s){$("vT").textContent=t;$("vS").textContent=s||"";$("verdict").classList.remove("hide")}
function exportPng(){
  var t=document.createElement("canvas");t.width=cv.width;t.height=cv.height;
  var tc=t.getContext("2d");tc.drawImage(cv,0,0);
  var id=tc.getImageData(0,0,t.width,t.height),p=id.data,inkd=false;
  for(var i=0;i<p.length;i+=4){if(p[i+3]>0){p[i]=p[i+1]=p[i+2]=0;p[i+3]=255;inkd=true}}
  if(!inkd)return Promise.resolve(null);
  tc.putImageData(id,0,0);
  var o=document.createElement("canvas");o.width=t.width;o.height=t.height;
  var oc=o.getContext("2d");oc.fillStyle="#fff";oc.fillRect(0,0,o.width,o.height);oc.drawImage(t,0,0);
  return new Promise(function(res){o.toBlob(res,"image/png")});
}
function buildPrompt(){
  var kind=sname().toLowerCase(),task,rules;
  if(curKind==="kana"){
    var what=mode==="alpha"?"the "+kind+" character "+cur.k+" (romaji '"+cur.r+"')":"the word "+cur.k+" (romaji '"+cur.r+"', meaning '"+cur.e+"') in "+kind;
    task="write "+what;
    rules="The handwriting is Japanese. Be lenient about neatness, size and wobble, but similar-looking kana (e.g. さ/き, ぬ/め, シ/ツ, ソ/ン) must be told apart"+(mode==="word"?", and every character must be present in the right order":"")+". A different character is always 'wrong'.";
  }else if(curKind==="en"){
    task="write the English meaning of the Japanese word "+cur.k+" (romaji '"+cur.r+"')";
    rules="The handwriting is in English letters. Expected meaning: '"+cur.e+"' (if several are listed with '/', any one is fine; accept clear synonyms). Capitalization and neatness do not matter. 'close' = right word with a spelling slip or a hard-to-read letter; 'wrong' = different meaning.";
  }else{
    task="write the romaji reading of the word "+cur.k+" (meaning '"+cur.e+"')";
    rules="The handwriting is in Latin letters. Expected romaji: '"+cur.r+"'. Accept standard Hepburn variants (ou/oo/ō etc.). 'close' = one letter off or a hard-to-read letter; 'wrong' otherwise.";
  }
  return "The image is a handwritten answer on a white background. The learner was asked to "+task+". "+rules+" Grade it 'correct' (clearly right), 'close' (recognizable as the right answer but with flaws, e.g. odd kana proportions, a missing or extra small stroke, a wrong stroke direction, bad spacing, or a small spelling slip) or 'wrong'. Reply with JSON only: {\"grade\":\"correct\" or \"close\" or \"wrong\",\"read\":\"what you read the handwriting as\",\"tip\":\"one specific improvement tip, max 15 words (for correct, short praise)\"}";
}
$("check").onclick=async function(){
  if(busy)return;
  if(curKind!=="kana"){typedCheck();return}
  var blob=await exportPng();
  if(!blob){say("Draw something first ✏️","");return}
  var auto=false,btn=$("check");
  if(sample){
    busy=true;btn.textContent="Checking…";
    try{
      var lim=await sample.limits();
      if(lim&&lim.images){
        var res=await sample.json(buildPrompt(),{images:[blob],modelTier:"quick",cache:false});
        var g=res.grade;lastOK=(g==="correct"||g==="close");scored=true;total++;if(lastOK)right++;score();
        var ttl=g==="close"?"✓ Close — counted!":(lastOK?"✓ Correct!":"✗ Not quite");
        say(ttl+" I read: "+(res.read||"?"),(g==="close"?"Note to improve: ":"")+(res.tip||""));
        auto=true;
      }
    }catch(e){if(e&&e.code==="not_granted")sample=null}
    busy=false;btn.textContent="Check";
  }
  ghost.className="ghost answer";$("r1").classList.add("hide");
  if(auto){$("r3").classList.remove("hide")}
  else{say("Auto-check isn't available here","Compare with the answer and mark yourself.");$("r2").classList.remove("hide")}
};
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=0;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function normEn(s){return s.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^(a|an|the) /,"")}
function normRo(s){return s.toLowerCase().replace(/ā/g,"aa").replace(/ī/g,"ii").replace(/ū/g,"uu").replace(/ē/g,"ee").replace(/[ōô]/g,"oo").replace(/['’\- ]/g,"").replace(/ou/g,"oo")}
function typedCheck(){
  var inp=$("typed"),v=inp.value;
  if(!v.trim()){say("Type your answer first ⌨️","");inp.focus();return}
  var opts,u;
  if(curKind==="en"){opts=curAns.split("/").map(normEn);opts.push(normEn(curAns));u=normEn(v)}
  else{opts=[normRo(curAns)];u=normRo(v)}
  var exact=opts.indexOf(u)>-1;
  var near=!exact&&opts.some(function(o){return o.length>=4&&lev(o,u)===1});
  lastOK=exact||near;scored=true;total++;if(lastOK)right++;score();
  inp.readOnly=true;
  if(exact)say("✓ Correct!",curAns);
  else if(near)say("✓ Close — counted!","Note to improve: check your spelling. Correct: "+curAns);
  else say("✗ Not quite","Correct answer: "+curAns);
  $("r1").classList.add("hide");$("r3").classList.remove("hide");
}
$("typed").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(!$("r3").classList.contains("hide"))next();else typedCheck()}});
$("nxt").onclick=function(){next()};
$("flip").onclick=function(){
  if(!scored)return;
  if(lastOK){right--}else{right++}
  lastOK=!lastOK;score();
  say(lastOK?"✓ Marked correct":"✗ Marked wrong","");
};
$("clear").onclick=function(){if(curKind!=="kana"){$("typed").value="";$("typed").focus()}else clearPad()};
$("got").onclick=function(){right++;total++;score();next()};
$("miss").onclick=function(){total++;score();next()};
trace.onchange=function(){if(!$("r1").classList.contains("hide"))ghost.className="ghost"+(trace.checked?" show":"")};
window.addEventListener("resize",function(){if(scr==="sDrill"){size();next(true)}});
</script>
